<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3C8C"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#A50C4B"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="textDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#550325" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="145" fill="url(#roseTextGrad)"/>
  <!-- Specular highlight -->
  <rect width="512" height="512" rx="145" fill="url(#topGlow)"/>

  <!-- Main Content with Shadow -->
  <g filter="url(#textDropShadow)">
    <!-- Stylized Handset Icon Above Text -->
    <g transform="translate(256, 140) scale(1.1)">
      <!-- Left & Right handset curves -->
      <circle cx="-32" cy="0" r="14" fill="#FFFFFF"/>
      <circle cx="32" cy="0" r="14" fill="#FFFFFF"/>
      <!-- Connecting arc -->
      <path d="M-28 6 C-15 20 15 20 28 6" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <!-- Audio wave rings above handset -->
      <path d="M-18 -14 C-8 -22 8 -22 18 -14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <path d="M-30 -26 C-12 -38 12 -38 30 -26" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Bold Brand Typography: Rosé -->
    <text x="256" y="315" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="132" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Rosé</text>

    <!-- Pill Subtitle: LIVE CALL -->
    <rect x="186" y="348" width="140" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.25"/>
    <text x="256" y="372" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LIVE CALL</text>
  </g>
</svg>
